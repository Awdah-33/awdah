<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عودة</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:white;
}

.container{
  width:90%;
  max-width:1200px;
  margin:auto;
}

.hero{
  min-height:50vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:radial-gradient(circle at top,#1d3552,#07111f 70%);
}

.logo{font-size:78px;margin:0}
.hero p{font-size:22px;color:#b9c6d8}

section{
  padding:55px 0;
  text-align:center;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  margin-top:35px;
}

.card{
  padding:30px 20px;
  border-radius:24px;
}

.bronze{background:#845735}
.silver{background:#c4c9cf;color:#111}
.gold{background:#d4a51d;color:#111}
.diamond{background:#53677f}

.form-box,.search-box{
  max-width:760px;
  margin:30px auto;
  background:#0d1b2d;
  border:1px solid #1d3048;
  border-radius:22px;
  padding:30px;
  text-align:right;
}

.form-group{margin-bottom:18px}

label{
  display:block;
  margin-bottom:8px;
  color:#c7d2e0;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #30445f;
  background:#081523;
  color:white;
  font-size:16px;
}

.plate-wrap{
  display:flex;
  justify-content:center;
  gap:8px;
  direction:rtl;
  flex-wrap:wrap;
}

.plate-cell{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.plate-box{
  width:54px;
  height:58px;
  text-align:center;
  padding:0;
  font-size:24px;
  font-weight:bold;
  border-radius:10px;
  background:#fff;
  color:#111;
  border:2px solid #475569;
}

.plate-english{
  margin-top:4px;
  min-height:18px;
  font-size:13px;
  color:#cbd5e1;
  font-weight:bold;
}

.plate-separator{
  width:14px;
}

.plate-help{
  margin-top:10px;
  font-size:13px;
  color:#94a3b8;
  text-align:center;
}

button{
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.save-btn{
  width:100%;
  padding:14px;
  background:white;
  color:#07111f;
  font-size:17px;
}

.customer-list{
  display:grid;
  gap:18px;
  margin-top:30px;
}

.customer-item{
  background:#0d1b2d;
  border:1px solid #1d3048;
  border-radius:18px;
  padding:22px;
  text-align:right;
}

.customer-meta{
  color:#b9c6d8;
  line-height:1.9;
}

.badge,.progress,.reward{
  margin-top:12px;
  padding:10px 14px;
  border-radius:12px;
}

.badge{
  display:inline-block;
  background:#1d3048;
  font-weight:bold;
}

.progress{background:#081523}

.reward{
  background:#12321f;
  color:#d8ffe3;
  font-weight:bold;
}

.cars-box{
  margin-top:18px;
  padding:15px;
  border-radius:14px;
  background:#081523;
}

.car-item{
  padding:16px;
  margin-top:10px;
  background:#122236;
  border-radius:12px;
}

.add-car-form{
  display:none;
  margin-top:15px;
  padding:18px;
  background:#101f33;
  border:1px solid #30445f;
  border-radius:14px;
}

.add-car-form select{
  margin-top:15px;
}

.add-car-buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.car-actions,.actions{
  display:flex;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
}

.wash-btn,
.free-btn,
.car-btn,
.delete-btn,
.cancel-btn{
  padding:12px 18px;
}

.wash-btn{
  background:white;
  color:#07111f;
}

.free-btn{
  background:#166534;
  color:white;
}

.car-btn{
  background:#6d28d9;
  color:white;
}

.delete-btn{
  background:#7f1d1d;
  color:white;
}

.cancel-btn{
  background:#475569;
  color:white;
}

.price-box{
  margin-top:12px;
  padding:12px;
  background:#0b1728;
  border-radius:10px;
  line-height:1.8;
}

footer{
  text-align:center;
  padding:30px;
  border-top:1px solid #1d3048;
  color:#8192a8;
}

@media(max-width:900px){
  .cards{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
  .cards{grid-template-columns:1fr}
  .logo{font-size:58px}

  .plate-box{
    width:42px;
    height:50px;
    font-size:20px;
  }
}
</style>

.saudi-plate{

  color:#111;
  border:3px solid #111;
  border-radius:8px;

}
</style>


<style>
.wash-history{
  margin-top:18px;
  padding:15px;
  background:#081523;
  border-radius:14px;
}

.wash-history h4{

}

.history-item{

}

.history-free{

<style>
.invoice-btn{
  margin-top:10px;
  padding:10px 14px;
  background:#1d4ed8;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.invoice-modal{

  align-items:center;

.invoice-card{

  max-width:520px;

  color:#111827;
  border-radius:18px;
  padding:28px;
  text-align:right;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.invoice-card h2{

.invoice-row{

.invoice-total{

  background:#f3f4f6;

  font-weight:bold;

}

.invoice-actions{
  display:flex;

.close-invoice{
  flex:1;

}

.print-invoice{
  flex:1;
  padding:12px;
  background:#111827;

}
</style>


<style>
.invoice-brand{
  text-align:center;
  margin-bottom:20px;
}

.invoice-brand .name{
  font-size:34px;
  font-weight:bold;
}

.invoice-brand .sub{
  margin-top:5px;
  color:#64748b;
}

.whatsapp-invoice{
  flex:1;
  padding:12px;
  background:#166534;
  color:white;
}
</style>

.qr-box{

.qr-title{

}

.qr-id{
  color:#475569;

</head>

<body>

<header class="hero">
  <div>
    <h1 class="logo">عودة</h1>
    <p>منصة ولاء ذكية لمغاسل السيارات</p>
  </div>
</header>

<section class="container">
  <h2>عضويات عودة</h2>

  <div class="cards">
    <div class="card bronze">
      <h3>البرونزية</h3>
      <p>بعد 5 غسلات</p>
      <strong>خصم 5%</strong>
    </div>

    <div class="card silver">
      <h3>الفضية</h3>
      <p>بعد 10 غسلات</p>
      <strong>خصم 10%</strong>
    </div>

    <div class="card gold">
      <h3>الذهبية</h3>
      <p>بعد 15 غسلة</p>
      <strong>خصم 15%</strong>
    </div>

    <div class="card diamond">
      <h3>الماسية</h3>
      <p>بعد 20 غسلة</p>
      <strong>خصم 20%</strong>
    </div>
  </div>
</section>

<section class="container">
  <h2>تسجيل عميل جديد</h2>

  <div class="form-box">

    <div class="form-group">
      <label>اسم العميل</label>
      <input id="name">
    </div>

    <div class="form-group">
      <label>رقم الجوال</label>
      <input id="phone">
    </div>

    <div class="form-group">
      <label>رقم اللوحة</label>

      <div class="plate-wrap" id="newCustomerPlate">

        <div class="plate-cell">
          <input class="plate-box plate-letter" maxlength="1">
          <div class="plate-english"></div>
        </div>

        <div class="plate-cell">
          <input class="plate-box plate-letter" maxlength="1">
          <div class="plate-english"></div>
        </div>

        <div class="plate-cell">
          <input class="plate-box plate-letter" maxlength="1">
          <div class="plate-english"></div>
        </div>

        <div class="plate-separator"></div>

        <div class="plate-cell">
          <input class="plate-box plate-number" maxlength="1" inputmode="numeric">
          <div class="plate-english"></div>
        </div>

        <div class="plate-cell">
          <input class="plate-box plate-number" maxlength="1" inputmode="numeric">
          <div class="plate-english"></div>
        </div>

        <div class="plate-cell">
          <input class="plate-box plate-number" maxlength="1" inputmode="numeric">
          <div class="plate-english"></div>
        </div>

        <div class="plate-cell">
          <input class="plate-box plate-number" maxlength="1" inputmode="numeric">
          <div class="plate-english"></div>
        </div>

      </div>

      <div class="plate-help">
        اكتب 3 حروف عربية ثم 4 أرقام
      </div>
    </div>

    <div class="form-group">
      <label>حجم السيارة</label>
      <select id="size">
        <option value="">اختر الحجم</option>
        <option value="صغيرة">صغيرة</option>
        <option value="متوسطة">متوسطة</option>
        <option value="كبيرة">كبيرة</option>
      </select>
    </div>

    <button class="save-btn" onclick="saveCustomer()">
      حفظ العميل والسيارة
    </button>

  </div>
</section>

<section class="container">

  <h2>البحث عن عميل</h2>

  <div class="search-box">
    <label>اكتب الاسم أو رقم الجوال أو رقم اللوحة</label>
    <input id="search" oninput="showCustomers()">
  </div>

  <h2>العملاء المسجلون</h2>

  <div id="customerList" class="customer-list"></div>

</section>

<footer>© 2026 عودة</footer>

<script>

const saudiLetters={
  "ا":"A",
  "ب":"B",
  "ح":"J",
  "د":"D",
  "ر":"R",
  "س":"S",
  "ص":"X",
  "ط":"T",
  "ع":"E",
  "ق":"G",
  "ك":"K",
  "ل":"L",
  "م":"Z",
  "ن":"N",
  "ه":"H",
  "و":"U",
  "ى":"V"
};

function getCustomers(){
  return JSON.parse(localStorage.getItem("awdahCustomers")) || [];
}

function saveCustomers(customers){
  localStorage.setItem("awdahCustomers",JSON.stringify(customers));
}

function getMembership(washes){
  if(washes>=20)return{name:"الماسية",discount:20};
  if(washes>=15)return{name:"الذهبية",discount:15};
  if(washes>=10)return{name:"الفضية",discount:10};
  if(washes>=5)return{name:"البرونزية",discount:5};
  return{name:"بدون عضوية",discount:0};
}

function getNextLevel(washes){
  if(washes<5)return{name:"البرونزية",remaining:5-washes};
  if(washes<10)return{name:"الفضية",remaining:10-washes};
  if(washes<15)return{name:"الذهبية",remaining:15-washes};
  if(washes<20)return{name:"الماسية",remaining:20-washes};
  return null;
}

function getPrice(size){
  if(size==="صغيرة")return 25;
  if(size==="متوسطة")return 30;
  if(size==="كبيرة")return 35;
  return 30;
}

function normalizeCustomer(customer){
  customer.cars=customer.cars||[];
  customer.freeWashes=customer.freeWashes||0;
  customer.rewardedLevels=customer.rewardedLevels||[];
  customer.history=customer.history||[];

  customer.cars.forEach(car=>{
    if(car.washes===undefined)car.washes=0;
  });

  return customer;
}

function normalizeArabicLetter(letter){

  if(letter==="ي")return "ى";
  if(letter==="أ" || letter==="إ" || letter==="آ")return "ا";

  return letter;
}

function setupPlateInputs(container){

  const boxes=[...container.querySelectorAll(".plate-box")];

  boxes.forEach((box,index)=>{

    box.addEventListener("input",()=>{

      if(box.classList.contains("plate-letter")){

        let value=box.value.slice(-1);
        value=normalizeArabicLetter(value);

        if(!saudiLetters[value]){
          box.value="";
        }else{
          box.value=value;

          const english=
            box.parentElement.querySelector(".plate-english");

          if(english){
            english.textContent=saudiLetters[value];
          }
        }
      }

      if(box.classList.contains("plate-number")){

        box.value=
          box.value
          .replace(/[^0-9٠-٩]/g,"")
          .slice(0,1);
      }

      if(box.value && index<boxes.length-1){
        boxes[index+1].focus();
      }
    });

    box.addEventListener("keydown",(e)=>{

      if(e.key==="Backspace"){

        if(box.classList.contains("plate-letter")){
          const english=
            box.parentElement.querySelector(".plate-english");

          if(english)english.textContent="";
        }

        if(!box.value && index>0){
          boxes[index-1].focus();
        }
      }
    });

  });
}

function getPlateFromContainer(container){

  const letters=[...container.querySelectorAll(".plate-letter")]
    .map(i=>i.value.trim());

  const numbers=[...container.querySelectorAll(".plate-number")]
    .map(i=>i.value.trim());

  if(letters.some(v=>!v) || numbers.some(v=>!v)){
    return "";
  }

  return letters.join(" ")+" "+numbers.join("");
}

function getEnglishPlateFromArabic(plate){

  const parts=plate.split(" ");
  const letters=parts.slice(0,3);
  const numbers=parts.slice(3).join("");

  const englishLetters=
    letters.map(letter=>saudiLetters[letter]||"").join(" ");

  return englishLetters+" "+numbers;
}

function clearPlateContainer(container){

  container.querySelectorAll(".plate-box")
    .forEach(i=>i.value="");

  container.querySelectorAll(".plate-english")
    .forEach(i=>i.textContent="");
}

function plateExists(customers,plate){

  const clean=plate.replace(/\s/g,"").toLowerCase();

  return customers.some(c=>
    c.cars.some(car=>
      car.plate.replace(/\s/g,"").toLowerCase()===clean
    )
  );
}

function saveCustomer(){

  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();

  const plateContainer=
    document.getElementById("newCustomerPlate");

  const plate=getPlateFromContainer(plateContainer);

  const size=document.getElementById("size").value;

  if(!name || !phone || !plate || !size){
    alert("أكمل جميع بيانات العميل والسيارة");
    return;
  }

  const customers=getCustomers().map(normalizeCustomer);

  if(customers.some(c=>c.phone===phone)){
    alert("هذا رقم الجوال مسجل مسبقًا");
    return;
  }

  if(plateExists(customers,plate)){
    alert("رقم اللوحة مسجل مسبقًا");
    return;
  }

  customers.push({
    id:Date.now(),
    name,
    phone,
    washes:0,
    freeWashes:0,
    rewardedLevels:[],
    history:[],
    cars:[{
      id:Date.now()+1,
      plate,
      size,
      washes:0
    }]
  });

  saveCustomers(customers);

  document.getElementById("name").value="";
  document.getElementById("phone").value="";
  document.getElementById("size").value="";

  clearPlateContainer(plateContainer);

  showCustomers();

  alert("✅ تم تسجيل العميل والسيارة");
}

function toggleAddCar(id){

  const form=document.getElementById("addCarForm-"+id);

  if(!form)return;

  form.style.display=
    form.style.display==="block"
    ? "none"
    : "block";

  if(form.style.display==="block"){

    const container=
      document.getElementById("addCarPlate-"+id);

    const first=container.querySelector(".plate-box");

    if(first)first.focus();
  }
}

function saveAddedCar(customerId){

  const customers=getCustomers().map(normalizeCustomer);

  const customer=
    customers.find(c=>c.id===customerId);

  if(!customer)return;

  const plateContainer=
    document.getElementById("addCarPlate-"+customerId);

  const sizeElement=
    document.getElementById("addCarSize-"+customerId);

  const plate=getPlateFromContainer(plateContainer);
  const size=sizeElement.value;

  if(!plate || !size){
    alert("أكمل رقم اللوحة وحجم السيارة");
    return;
  }

  if(plateExists(customers,plate)){
    alert("رقم اللوحة مسجل مسبقًا");
    return;
  }

  customer.cars.push({
    id:Date.now(),
    plate,
    size,
    washes:0
  });

  saveCustomers(customers);
  showCustomers();

  alert("✅ تمت إضافة السيارة");
}

function addWash(customerId,carId){

  const customers=getCustomers().map(normalizeCustomer);

  const customer=
    customers.find(c=>c.id===customerId);

  if(!customer)return;

  const car=
    customer.cars.find(c=>c.id===carId);

  if(!car)return;

  const membership=
    getMembership(customer.washes);

  const originalPrice=
    getPrice(car.size);

  const finalPrice=
    originalPrice-
    (originalPrice*(membership.discount/100));

  const message=
`السيارة: ${car.plate}
${getEnglishPlateFromArabic(car.plate)}
الحجم: ${car.size}
السعر الأساسي: ${originalPrice} ريال
خصم العضوية: ${membership.discount}%
السعر النهائي: ${finalPrice.toFixed(2)} ريال

هل تريد تسجيل الغسلة؟`;

  if(!confirm(message))return;

  customer.washes++;
  car.washes++;

  customer.history=customer.history||[];

  customer.history.unshift({
    id:Date.now(),
    date:new Date().toLocaleString("ar-SA"),
    plate:car.plate,
    size:car.size,
    originalPrice:originalPrice,
    discount:membership.discount,
    paid:Number(finalPrice.toFixed(2)),
    free:false
  });

  if(
    [5,10,15,20].includes(customer.washes) &&
    !customer.rewardedLevels.includes(customer.washes)
  ){
    customer.freeWashes++;
    customer.rewardedLevels.push(customer.washes);

    alert("🎉 تمت الترقية وإضافة غسلة مجانية");
  }

  saveCustomers(customers);
  showCustomers();
}

function useFreeWash(customerId,carId){

  const customers=getCustomers().map(normalizeCustomer);

  const customer=
    customers.find(c=>c.id===customerId);

  if(!customer || customer.freeWashes<=0){
    alert("لا توجد غسلات مجانية");
    return;
  }

  const car=
    customer.cars.find(c=>c.id===carId);

  if(!car)return;

  if(!confirm(
    "تأكيد استخدام الغسلة المجانية للسيارة "+car.plate+"؟"
  ))return;

  customer.freeWashes--;

  customer.history=customer.history||[];

  customer.history.unshift({
    id:Date.now(),
    date:new Date().toLocaleString("ar-SA"),
    plate:car.plate,
    size:car.size,
    originalPrice:getPrice(car.size),
    discount:100,
    paid:0,
    free:true
  });

  saveCustomers(customers);
  showCustomers();

  alert("✅ تم استخدام الغسلة المجانية");
}

function deleteCar(customerId,carId){

  if(!confirm("هل تريد حذف هذه السيارة؟"))return;

  const customers=getCustomers().map(normalizeCustomer);

  const customer=
    customers.find(c=>c.id===customerId);

  if(!customer)return;

  customer.cars=
    customer.cars.filter(c=>c.id!==carId);

  saveCustomers(customers);
  showCustomers();
}

function deleteCustomer(id){

  if(!confirm("هل تريد حذف العميل بالكامل؟"))return;

  const customers=
    getCustomers().filter(c=>c.id!==id);

  saveCustomers(customers);
  showCustomers();
}


function renderSaudiPlate(plate){

  const parts=plate.split(" ");

  const arabicLetters=parts.slice(0,3).join(" ");
  const arabicNumbers=parts.slice(3).join("");

  const englishFull=getEnglishPlateFromArabic(plate).split(" ");

  const englishLetters=englishFull.slice(0,3).join(" ");
  const englishNumbers=arabicNumbers;

  return `
    <div class="saudi-plate">

      <div class="saudi-side">
        <div>السعودية</div>
        <div class="ksa">KSA</div>
      </div>

      <div class="saudi-main">

        <div class="saudi-part">
          <div class="saudi-ar">${arabicNumbers}</div>
          <div class="saudi-en">${englishNumbers}</div>
        </div>

        <div class="saudi-part">
          <div class="saudi-ar">${arabicLetters}</div>
          <div class="saudi-en">${englishLetters}</div>
        </div>

      </div>

    </div>
  `;
}




let currentInvoice=null;

function openInvoice(customerId,historyId){

  const customers=getCustomers().map(normalizeCustomer);

  const customer=customers.find(c=>c.id===customerId);

  if(!customer)return;

  const item=(customer.history||[]).find(
    h=>h.id===historyId
  );

  if(!item)return;

  const invoiceNumber =
    "AWD-" + String(item.id).slice(-8);

  currentInvoice={
    invoiceNumber,
    customer,
    item
  };

  const content=document.getElementById("invoiceContent");

  content.innerHTML=`

    <div class="invoice-row">
      <span>رقم الفاتورة</span>
      <strong>${invoiceNumber}</strong>
    </div>

    <div class="invoice-row">
      <span>اسم العميل</span>
      <strong>${customer.name}</strong>
    </div>

    <div class="invoice-row">
      <span>رقم الجوال</span>
      <strong>${customer.phone}</strong>
    </div>

    <div class="invoice-row">
      <span>رقم اللوحة</span>
      <strong>${item.plate}</strong>
    </div>

    <div class="invoice-row">
      <span>حجم السيارة</span>
      <strong>${item.size}</strong>
    </div>

    <div class="invoice-row">
      <span>التاريخ</span>
      <strong>${item.date}</strong>
    </div>

    <div class="invoice-row">
      <span>السعر الأساسي</span>
      <strong>${item.originalPrice} ريال</strong>
    </div>

    <div class="invoice-row">
      <span>الخصم</span>
      <strong>${item.discount}%</strong>
    </div>

    <div class="invoice-total">
      المبلغ النهائي:
      ${Number(item.paid).toFixed(2)} ريال
    </div>

  `;

  document.getElementById("invoiceModal").style.display="flex";
}


function sendInvoiceWhatsApp(){

  if(!currentInvoice)return;

  const {invoiceNumber,customer,item}=currentInvoice;

  let phone=(customer.phone || "").replace(/\D/g,"");

  if(phone.startsWith("0")){
    phone="966"+phone.slice(1);
  }

  const message=
`عودة
فاتورة غسيل سيارة

رقم الفاتورة: ${invoiceNumber}
العميل: ${customer.name}
رقم اللوحة: ${item.plate}
حجم السيارة: ${item.size}
التاريخ: ${item.date}
السعر الأساسي: ${item.originalPrice} ريال
الخصم: ${item.discount}%
المبلغ النهائي: ${Number(item.paid).toFixed(2)} ريال

شكرًا لاختيارك عودة`;

  const url=
    "https://wa.me/"+phone+
    "?text="+encodeURIComponent(message);

  window.open(url,"_blank");
}

function closeInvoice(){
  document.getElementById("invoiceModal").style.display="none";
}

function printInvoice(){
  window.print();
}

function renderHistory(customer){

  const history=customer.history||[];

  if(history.length===0){
    return `
      <div class="wash-history">
        <h4>سجل الغسلات</h4>
        <p>لا توجد غسلات مسجلة حتى الآن.</p>
      </div>
    `;
  }

  const items=history.slice(0,10).map(item=>`

    <div class="history-item ${item.free ? "history-free" : ""}">

      <strong>
        ${item.free ? "🎁 غسلة مجانية" : "🧾 غسلة مدفوعة"}
      </strong><br>

      التاريخ: ${item.date}<br>
      اللوحة: ${item.plate}<br>
      الحجم: ${item.size}<br>
      السعر الأساسي: ${item.originalPrice} ريال<br>
      الخصم: ${item.discount}%<br>

      <strong>
        المبلغ المدفوع: ${Number(item.paid).toFixed(2)} ريال
      </strong><br>

      <button
        class="invoice-btn"
        onclick="openInvoice(${customer.id},${item.id})">
        عرض الفاتورة
      </button>

    </div>

  `).join("");

  return `
    <div class="wash-history">
      <h4>سجل الغسلات</h4>
      ${items}
    </div>
  `;
}


function createCustomerQR(customer){

  const element=document.getElementById("qr-"+customer.id);

  if(!element || typeof QRCode==="undefined")return;

  element.innerHTML="";

  const baseUrl =
    window.location.origin + window.location.pathname;

  const data =
    baseUrl + "?customer=" + customer.id;

  new QRCode(element,{
    text:data,
    width:120,
    height:120
  });
}

function showCustomers(){

  let customers=
    getCustomers().map(normalizeCustomer);

  const params = new URLSearchParams(window.location.search);
  const customerId = params.get("customer");

  if(customerId){
    customers = customers.filter(
      customer => String(customer.id) === String(customerId)
    );
  }

  const search=
    (document.getElementById("search")?.value||"")
    .trim()
    .toLowerCase();

  if(search){

    customers=customers.filter(customer=>

      customer.name.toLowerCase().includes(search) ||

      customer.phone.toLowerCase().includes(search) ||

      customer.cars.some(car=>
        car.plate.toLowerCase().includes(search) ||
        getEnglishPlateFromArabic(car.plate)
          .toLowerCase()
          .includes(search)
      )
    );
  }

  const list=
    document.getElementById("customerList");

  if(customers.length===0){

    list.innerHTML="<p>لا يوجد عميل مطابق.</p>";
    return;
  }

  list.innerHTML="";

  customers.forEach(customer=>{

    const membership=
      getMembership(customer.washes);

    const next=
      getNextLevel(customer.washes);

    const progress=next
      ? `باقي ${next.remaining} غسلة للوصول إلى ${next.name}`
      : "وصل إلى أعلى عضوية ⭐";

    const carsHtml=
      customer.cars.map(car=>{

        const price=getPrice(car.size);

        const finalPrice=
          price-
          (price*(membership.discount/100));

        return `
          <div class="car-item">

            ${renderSaudiPlate(car.plate)}

            الحجم: ${car.size}<br>

            غسلات السيارة:
            <strong>${car.washes}</strong>

            <div class="price-box">
              السعر الأساسي: ${price} ريال<br>
              الخصم: ${membership.discount}%<br>

              السعر بعد الخصم:
              <strong>${finalPrice.toFixed(2)} ريال</strong>
            </div>

            <div class="car-actions">

              <button
                class="wash-btn"
                onclick="addWash(${customer.id},${car.id})">
                تسجيل غسلة
              </button>

              ${
                customer.freeWashes>0
                ? `<button
                    class="free-btn"
                    onclick="useFreeWash(${customer.id},${car.id})">
                    استخدام غسلة مجانية
                   </button>`
                : ""
              }

              <button
                class="delete-btn"
                onclick="deleteCar(${customer.id},${car.id})">
                حذف السيارة
              </button>

            </div>
          </div>
        `;
      }).join("");

    const item=
      document.createElement("div");

    item.className="customer-item";

    item.innerHTML=`

      <h3>${customer.name}</h3>

      <div class="customer-meta">

        رقم الجوال:
        ${customer.phone}<br>

        إجمالي الغسلات:
        <strong>${customer.washes}</strong><br>

        الخصم الحالي:
        <strong>${membership.discount}%</strong><br>

        الغسلات المجانية:
        <strong>${customer.freeWashes}</strong>

      </div>

      <div class="badge">
        ${membership.name}
      </div>

      <div class="progress">
        ${progress}
      </div>

      ${
        customer.freeWashes>0
        ? `<div class="reward">
             🎁 لدى العميل ${customer.freeWashes} غسلة مجانية
           </div>`
        : ""
      }

      <div class="cars-box">

        <strong>سيارات العميل</strong>

        ${carsHtml || "<p>لا توجد سيارات مسجلة.</p>"}

        <div
          id="addCarForm-${customer.id}"
          class="add-car-form">

          <label>رقم لوحة السيارة الجديدة</label>

          <div
            class="plate-wrap dynamic-plate"
            id="addCarPlate-${customer.id}">

            <div class="plate-cell">
              <input class="plate-box plate-letter" maxlength="1">
              <div class="plate-english"></div>
            </div>

            <div class="plate-cell">
              <input class="plate-box plate-letter" maxlength="1">
              <div class="plate-english"></div>
            </div>

            <div class="plate-cell">
              <input class="plate-box plate-letter" maxlength="1">
              <div class="plate-english"></div>
            </div>

            <div class="plate-separator"></div>

            <div class="plate-cell">
              <input class="plate-box plate-number" maxlength="1" inputmode="numeric">
              <div class="plate-english"></div>
            </div>

            <div class="plate-cell">
              <input class="plate-box plate-number" maxlength="1" inputmode="numeric">
              <div class="plate-english"></div>
            </div>

            <div class="plate-cell">
              <input class="plate-box plate-number" maxlength="1" inputmode="numeric">
              <div class="plate-english"></div>
            </div>

            <div class="plate-cell">
              <input class="plate-box plate-number" maxlength="1" inputmode="numeric">
              <div class="plate-english"></div>
            </div>

          </div>

          <select id="addCarSize-${customer.id}">

            <option value="">
              اختر حجم السيارة
            </option>

            <option value="صغيرة">صغيرة</option>
            <option value="متوسطة">متوسطة</option>
            <option value="كبيرة">كبيرة</option>

          </select>

          <div class="add-car-buttons">

            <button
              class="car-btn"
              onclick="saveAddedCar(${customer.id})">
              حفظ السيارة
            </button>

            <button
              class="cancel-btn"
              onclick="toggleAddCar(${customer.id})">
              إلغاء
            </button>

          </div>

        </div>

      </div>

      ${renderHistory(customer)}

      <div class="qr-box">
        <div class="qr-title">QR العميل</div>
        <div id="qr-${customer.id}" class="qr-code"></div>
        <div class="qr-id">ID: ${customer.id}</div>
      </div>

      <div class="actions">

        <button
          class="car-btn"
          onclick="toggleAddCar(${customer.id})">
          + إضافة سيارة
        </button>

        <button
          class="delete-btn"
          onclick="deleteCustomer(${customer.id})">
          حذف العميل
        </button>

      </div>
    `;

    list.appendChild(item);
  });

  document
    .querySelectorAll(".dynamic-plate")
    .forEach(setupPlateInputs);

  customers.forEach(createCustomerQR);

  saveCustomers(
    getCustomers().map(normalizeCustomer)
  );
}

setupPlateInputs(
  document.getElementById("newCustomerPlate")
);

showCustomers();

</script>


<div id="invoiceModal" class="invoice-modal">
  <div class="invoice-card">

    <div class="invoice-brand">
      <div class="name">عودة</div>
      <div class="sub">فاتورة غسيل سيارة</div>
    </div>

    <div id="invoiceContent"></div>

    <div class="invoice-actions">

      <button
        class="whatsapp-invoice"
        onclick="sendInvoiceWhatsApp()">
        إرسال واتساب
      </button>

      <button
        class="print-invoice"
        onclick="printInvoice()">
        طباعة الفاتورة
      </button>

      <button
        class="close-invoice"
        onclick="closeInvoice()">
        إغلاق
      </button>

    </div>
  </div>
</div>

</body>
</html>
